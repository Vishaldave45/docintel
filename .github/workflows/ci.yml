name: DocIntel CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Linters
        run: |
          pip install ruff black mypy

      - name: Run Backend Linting
        run: |
          ruff format backend/ ml/
          ruff check backend/ ml/
          mypy backend/app ml/

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Typecheck & Lint
        run: |
          npm run lint

  test-backend:
    name: Backend Tests & Database Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: docintel
          POSTGRES_PASSWORD: docintel_secret_password
          POSTGRES_DB: docintel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            poppler-utils

      - name: Install Dependencies
        run: |
          cd backend
          pip install -e ".[test]"

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://docintel:docintel_secret_password@localhost:5432/docintel_test
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest with Coverage
        env:
          DATABASE_URL: postgresql+asyncpg://docintel:docintel_secret_password@localhost:5432/docintel_test
          ENV: test
        run: |
          cd backend
          pytest --cov=app --cov-report=xml --cov-report=term-missing tests/

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage.xml

  test-frontend:
    name: Frontend Unit & Component Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Build Test
        run: npm run build

  build:
    name: Docker Image Verification
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: docintel-backend:latest

  deploy:
    name: Deploy to Registry & Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy Placeholder
        run: |
          echo "Release verification passed. Ready for automated GHCR container push."
