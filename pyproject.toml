[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "BLE001", "S110", "I001", "UP037"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
disallow_untyped_decorators = false
warn_unused_ignores = false
mypy_path = ["backend", "."]

