[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Only include the app package — exclude alembic/, tests/, venv/ etc.
include = ["app*"]

[project]
name = "docintel-backend"
version = "1.0.0"
description = "Multimodal Document Intelligence Platform backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "DocIntel Architecture Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "structlog>=24.1.0",
    "python-multipart>=0.0.9",
    "tenacity>=8.2.3",
    "scikit-learn>=1.4.1",
    "joblib>=1.3.2",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=2.5.1",
    "transformers>=4.38.2",
    "torch>=2.2.1",
    "langchain>=0.1.13",
    "langchain-openai>=0.1.1",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.0.30",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "pillow>=10.2.0",
    "pypdf>=4.1.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=4.1.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0"
]
dev = [
    "ruff>=0.3.4",
    "black>=24.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.2"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI's File(...) and Depends(...) in argument defaults is an established pattern.
# BLE001: Broad exception catches in LLM wrapper are intentional (many API error types).
ignore = ["B008", "BLE001"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
